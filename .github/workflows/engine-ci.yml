name: Match Engine Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: match-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate active databases
        run: |
          python -m json.tool data/teams.json > /dev/null
          python -m json.tool data/v13_player_traits.json > /dev/null
          python -m json.tool data/v13_rosters.json > /dev/null

      - name: Compile active engine core
        run: >-
          python -m compileall -q
          engine.py team_loader.py team_loader_v13.py
          engine_experiment_v13.py engine_experiment_v13_rules_hardening.py
          diagnostics_v13.py
          test_engine.py test_team_loader.py test_v13_persistence.py

      - name: Run universal engine invariants
        run: python -m unittest -v test_engine.py test_team_loader.py test_v13_persistence.py

      - name: Run economical active-engine smoke simulation
        run: python diagnostics_v13.py 10
