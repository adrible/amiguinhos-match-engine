name: Match Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate team database JSON
        run: python -m json.tool data/teams.json > /dev/null

      - name: Compile source
        run: python -m compileall -q engine.py team_loader.py test_engine.py test_team_loader.py diagnostics.py calibrate_amiguinhos.py

      - name: Run unit and regression tests
        run: python -m unittest -v test_engine.py test_team_loader.py

      - name: Run 100-match smoke simulation
        run: python diagnostics.py 100

      - name: Run 4,000-match Amiguinhos calibration
        if: github.event_name == 'push' && github.event.head_commit.message == 'ci: run Amiguinhos calibration'
        run: python calibrate_amiguinhos.py 1000
