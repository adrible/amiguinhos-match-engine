name: Interdimensional Quarterfinals Non-Dangan

on:
  push:
    branches:
      - tournament-interdimensional-20260918
    paths:
      - run_interdimensional_quarterfinals_non_dangan_v13.py
      - .github/workflows/interdimensional-quarterfinals-non-dangan.yml

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tournament pack
        run: python -m json.tool data/tournaments/torneio_16_times_engine_v13.json > /dev/null

      - name: Run non-Dangan quarterfinals
        run: python run_interdimensional_quarterfinals_non_dangan_v13.py

      - name: Upload quarterfinal result
        uses: actions/upload-artifact@v4
        with:
          name: tournament-interdimensional-quarterfinals-non-dangan
          path: artifacts/tournament_interdimensional_quarterfinals_non_dangan_result.json
