name: Live Historical P

on:
  push:
    branches: [live-test-brazil-germany-2014]
    paths:
      - 'live_sessions/brazil_germany_2014_command.json'

permissions:
  contents: write

jobs:
  press-p:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Advance exactly one p
        run: python live_historical_session_v13.py
      - name: Persist live state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_sessions/brazil_germany_2014_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist Brazil Germany 2014 live state"
          git push
