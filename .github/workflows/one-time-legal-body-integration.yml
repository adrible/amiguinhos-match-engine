name: One-time legal-body integration
on:
  push:
    branches: [v1.3-spatial-creativity-boldness]
    paths:
      - '.github/workflows/one-time-legal-body-integration.yml'
permissions:
  contents: write
jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3-spatial-creativity-boldness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire legal-body layer into v1.3 chain
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('engine_experiment_v13_defense.py')
          s = p.read_text()
          s = s.replace(
              'Extends the v1.3 body-orientation candidate without touching frozen v1.2.',
              'Extends the v1.3 legal-body-contact candidate without touching frozen v1.2.'
          )
          s = s.replace(
              'from engine_experiment_v13_body import MatchEngineV13Body',
              'from engine_experiment_v13_legal_body import MatchEngineV13LegalBody'
          )
          s = s.replace(
              'class MatchEngineV13Defense(MatchEngineV13Body):',
              'class MatchEngineV13Defense(MatchEngineV13LegalBody):'
          )
          p.write_text(s)
          PY
      - name: Run full regression suite
        run: python -m unittest -q
      - name: Commit permanent integration
        run: |
          rm .github/workflows/one-time-legal-body-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine_experiment_v13_defense.py .github/workflows/one-time-legal-body-integration.yml
          git commit -m "Integrate legal-body contacts and dummies into v1.3"
          git push
