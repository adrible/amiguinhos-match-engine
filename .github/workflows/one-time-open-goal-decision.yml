name: One-time open-goal decision
on:
  push:
    branches: [v1.3-spatial-creativity-boldness]
    paths: ['.github/workflows/one-time-open-goal-decision.yml']
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3-spatial-creativity-boldness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch explicit open-goal perception
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('engine_experiment_v13_spatial.py')
          s=p.read_text()
          s=s.replace('''        data["v13_keeper_up"] = {\n            "team": self._v13_keeper_up_team,\n            "until": self._v13_keeper_up_until,\n        }\n        return data\n''','''        data["v13_keeper_up"] = {\n            "team": self._v13_keeper_up_team,\n            "until": self._v13_keeper_up_until,\n        }\n        data["v13_open_goal_shot"] = getattr(self, "_v13_open_goal_shot", None)\n        return data\n''',1)
          s=s.replace('''        obj._v13_keeper_up_team = keeper.get("team")\n        obj._v13_keeper_up_until = float(keeper.get("until", 0.0))\n        return obj\n''','''        obj._v13_keeper_up_team = keeper.get("team")\n        obj._v13_keeper_up_until = float(keeper.get("until", 0.0))\n        obj._v13_open_goal_shot = data.get("v13_open_goal_shot")\n        return obj\n''',1)
          anchor='''    def _choose_actor(self, team: int, zone: Zone) -> PlayerState:\n'''
          insert='''    def _open_goal_direct_shot_profile(\n        self, team: int, actor: PlayerState, zone: Zone, ctx: dict\n    ) -> dict:\n        """Perception and willingness to shoot at an exposed goal."""\n        opponent = 1 - team\n        if zone.band == Band.DEF or not self._keeper_is_exposed(opponent):\n            return {"eligible": False, "perception_probability": 0.0, "attempt_probability_if_perceived": 0.0}\n        vision = actor.effective("vision") / 100.0\n        composure = actor.effective("composure") / 100.0\n        technique = actor.effective("technique") / 100.0\n        long_shots = actor.effective("long_shots") / 100.0\n        pressure = clamp(float(ctx.get("pressure", 0.5)))\n        space = clamp(float(ctx.get("space", 0.5)))\n        visibility = {Band.MID: 0.82, Band.ATT: 0.95, Band.BOX: 1.00}[zone.band]\n        lane_factor = 1.0 if zone.lane == Lane.CENTER else 0.93\n        perception = clamp((0.50 + 0.30 * vision + 0.12 * composure + 0.10 * space - 0.20 * pressure) * visibility * lane_factor, 0.0, 0.98)\n        strike_skill = 0.40 * long_shots + 0.34 * technique + 0.26 * composure\n        distance_bonus = {Band.MID: 0.02, Band.ATT: 0.13, Band.BOX: 0.22}[zone.band]\n        attempt = clamp(0.46 + 0.36 * strike_skill + 0.13 * space - 0.18 * pressure + distance_bonus, 0.28, 0.97)\n        return {"eligible": True, "perception_probability": perception, "attempt_probability_if_perceived": attempt}\n\n    def _resolve_shot(self, p):\n        marker = getattr(self, "_v13_open_goal_shot", None)\n        event = super()._resolve_shot(p)\n        if marker is not None and marker.get("team") == p.team and marker.get("actor") == p.actor:\n            event.data["open_goal"] = True\n            event.data["keeper_exposed"] = True\n            event.data["open_goal_perception"] = marker.get("perception_probability")\n            event.data["open_goal_attempt"] = marker.get("attempt_probability_if_perceived")\n        self._v13_open_goal_shot = None\n        return event\n\n'''
          if '_open_goal_direct_shot_profile' not in s:
              s=s.replace(anchor,insert+anchor,1)
          old='''        self._v13_forced_target = None\n        team = self._team_index_for_actor(actor)\n        if team is not None:\n            info = self._hidden_opportunity(team, actor, zone, ctx)\n'''
          new='''        self._v13_forced_target = None\n        self._v13_open_goal_shot = None\n        team = self._team_index_for_actor(actor)\n        if team is not None:\n            open_goal = self._open_goal_direct_shot_profile(team, actor, zone, ctx)\n            if (\n                open_goal["eligible"]\n                and self.rng.random() < open_goal["perception_probability"]\n                and self.rng.random() < open_goal["attempt_probability_if_perceived"]\n            ):\n                self._v13_open_goal_shot = {\n                    "team": team,\n                    "actor": actor.player.name,\n                    "perception_probability": round(open_goal["perception_probability"], 4),\n                    "attempt_probability_if_perceived": round(open_goal["attempt_probability_if_perceived"], 4),\n                }\n                return "shoot"\n            info = self._hidden_opportunity(team, actor, zone, ctx)\n'''
          if old not in s:
              raise SystemExit('choose-decision anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Add regression tests
        shell: bash
        run: |
          cat > test_v13_open_goal_decision.py <<'PY'
          from __future__ import annotations
          import unittest
          from engine import Band, Lane, Zone, make_generic_team
          from engine_experiment_v13_spatial import MatchEngineV13Spatial

          class OpenGoalDecisionTests(unittest.TestCase):
              def engine(self):
                  return MatchEngineV13Spatial(make_generic_team('Home',80,'balanced',seed=11),make_generic_team('Away',80,'balanced',seed=22),seed=33)
              def actor(self,e):
                  return next(ps for ps in e.teams[0].on_field if ps.player.position.upper() in {'AM','CM','ST','LW','RW'})
              def test_no_exposed_keeper_means_no_open_goal_signal(self):
                  e=self.engine(); a=self.actor(e)
                  self.assertFalse(e._open_goal_direct_shot_profile(0,a,Zone(Band.ATT,Lane.CENTER),{'pressure':0.2,'space':0.8})['eligible'])
              def test_open_goal_is_strongly_perceived_and_shot_dominates_when_seen(self):
                  e=self.engine(); a=self.actor(e); e._activate_keeper_up(1)
                  p=e._open_goal_direct_shot_profile(0,a,Zone(Band.ATT,Lane.CENTER),{'pressure':0.15,'space':0.85})
                  self.assertGreater(p['perception_probability'],0.75); self.assertGreater(p['attempt_probability_if_perceived'],0.80)
              def test_pressure_reduces_open_goal_response(self):
                  e=self.engine(); a=self.actor(e); e._activate_keeper_up(1)
                  lo=e._open_goal_direct_shot_profile(0,a,Zone(Band.MID,Lane.CENTER),{'pressure':0.05,'space':0.9})
                  hi=e._open_goal_direct_shot_profile(0,a,Zone(Band.MID,Lane.CENTER),{'pressure':0.95,'space':0.2})
                  self.assertGreater(lo['perception_probability'],hi['perception_probability']); self.assertGreater(lo['attempt_probability_if_perceived'],hi['attempt_probability_if_perceived'])
              def test_defensive_third_does_not_force_full_pitch_shot(self):
                  e=self.engine(); a=self.actor(e); e._activate_keeper_up(1)
                  self.assertFalse(e._open_goal_direct_shot_profile(0,a,Zone(Band.DEF,Lane.CENTER),{'pressure':0,'space':1})['eligible'])
              def test_marker_survives_roundtrip(self):
                  e=self.engine(); a=self.actor(e); e._activate_keeper_up(1)
                  e._v13_open_goal_shot={'team':0,'actor':a.player.name,'perception_probability':0.9,'attempt_probability_if_perceived':0.9}
                  c=MatchEngineV13Spatial.from_json(e.export_json()); self.assertEqual(c._v13_open_goal_shot['actor'],a.player.name)
          if __name__=='__main__': unittest.main()
          PY
      - name: Run tests
        run: python -m unittest -v test_v13_open_goal_decision.py test_v13_keeper_up_context.py test_v13_goalkeeper_receiver_eligibility.py test_spatial_decisions.py test_historical_2014_v13.py
      - name: Commit permanent implementation
        shell: bash
        run: |
          rm .github/workflows/one-time-open-goal-decision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine_experiment_v13_spatial.py test_v13_open_goal_decision.py .github/workflows/one-time-open-goal-decision.yml
          git commit -m "Add explicit open-goal shot perception in v1.3"
          git push
