name: One-time two-footed legal-body integration
on:
  push:
    branches: [v1.3-spatial-creativity-boldness]
    paths:
      - '.github/workflows/one-time-two-footed-legal-body.yml'
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3-spatial-creativity-boldness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add two-footed behavior without a new numeric attribute
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('engine_experiment_v13_legal_body.py')
          s = p.read_text()

          old = '''    @staticmethod
              def _preferred_and_weak_foot(actor: PlayerState) -> tuple[str, str]:
                  preferred = "left_foot" if (actor.player.preferred_foot or "R").upper() == "L" else "right_foot"
                  weak = "right_foot" if preferred == "left_foot" else "left_foot"
                  return preferred, weak
          '''.replace('              ', '')
          new = '''    @staticmethod
              def _footedness(actor: PlayerState) -> str:
                  raw = str(actor.player.preferred_foot or "R").strip().upper()
                  if raw in {"B", "BOTH", "AMBIDEXTROUS", "AMBIDEXTRO", "TWO_FOOTED", "TWO-FOOTED", "2"}:
                      return "B"
                  return "L" if raw == "L" else "R"

              @staticmethod
              def _preferred_and_weak_foot(actor: PlayerState) -> tuple[str, str]:
                  footedness = MatchEngineV13LegalBody._footedness(actor)
                  preferred = "left_foot" if footedness == "L" else "right_foot"
                  weak = "right_foot" if preferred == "left_foot" else "left_foot"
                  return preferred, weak

              @staticmethod
              def _weak_foot_difficulty(actor: PlayerState, family: str) -> float:
                  technique = clamp(actor.effective("technique") / 100.0)
                  floor, ceiling = {
                      "pass": (0.68, 0.94),
                      "control": (0.70, 0.95),
                      "shoot": (0.65, 0.92),
                  }.get(family, (0.68, 0.94))
                  return floor + (ceiling - floor) * (technique ** 1.15)
          '''.replace('              ', '')
          if old not in s:
              raise SystemExit('preferred-foot block not found')
          s = s.replace(old, new, 1)

          old = '''    def _part_category(self, actor: PlayerState, part: str) -> str:
                  preferred, weak = self._preferred_and_weak_foot(actor)
                  if part == preferred:
                      return "preferred_foot"
                  if part == weak:
                      return "weak_foot"
                  return part
          '''.replace('              ', '')
          new = '''    def _part_category(self, actor: PlayerState, part: str) -> str:
                  footedness = self._footedness(actor)
                  if footedness == "B" and part in {"right_foot", "left_foot"}:
                      return "preferred_foot"
                  preferred, weak = self._preferred_and_weak_foot(actor)
                  if part == preferred:
                      return "preferred_foot"
                  if part == weak:
                      return "weak_foot"
                  return part
          '''.replace('              ', '')
          if old not in s:
              raise SystemExit('part-category block not found')
          s = s.replace(old, new, 1)

          old = '        difficulty = base.get(category, 0.45)\n'
          new = '''        difficulty = base.get(category, 0.45)
                  if category == "weak_foot":
                      difficulty = self._weak_foot_difficulty(actor, family)
          '''.replace('              ', '')
          if old not in s:
              raise SystemExit('difficulty line not found')
          s = s.replace(old, new, 1)

          old = '''        preferred, weak = self._preferred_and_weak_foot(actor)
                  family = self._action_family(action)

                  weights = {
                      preferred: 1.00,
                      weak: 0.24,
                      "head": 0.035,
                      "chest": 0.018,
                      "thigh": 0.020,
                      "knee": 0.008,
                      "shin": 0.006,
                      "shoulder": 0.004,
                  }
                  weights[preferred] *= 1.0 - 0.42 * height
                  weights[weak] *= 1.0 - 0.28 * height
          '''.replace('              ', '')
          new = '''        preferred, weak = self._preferred_and_weak_foot(actor)
                  family = self._action_family(action)
                  footedness = self._footedness(actor)
                  technique_comfort = clamp(actor.effective("technique") / 100.0)
                  if footedness == "B":
                      preferred_weight = 0.86
                      weak_weight = 0.86
                  else:
                      preferred_weight = 1.00
                      weak_weight = 0.14 + 0.18 * (technique_comfort ** 1.10)

                  weights = {
                      preferred: preferred_weight,
                      weak: weak_weight,
                      "head": 0.035,
                      "chest": 0.018,
                      "thigh": 0.020,
                      "knee": 0.008,
                      "shin": 0.006,
                      "shoulder": 0.004,
                  }
                  if footedness == "B":
                      weights[preferred] *= 1.0 - 0.35 * height
                      weights[weak] *= 1.0 - 0.35 * height
                  else:
                      weights[preferred] *= 1.0 - 0.42 * height
                      weights[weak] *= 1.0 - 0.28 * height
          '''.replace('              ', '')
          if old not in s:
              raise SystemExit('body-part weight block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          t = Path('test_v13_legal_body_actions.py')
          tests = t.read_text()
          marker = "\n\nif __name__ == '__main__':\n"
          addition = '''

              def test_two_footed_profile_treats_both_feet_as_equally_natural(self):
                  e = self.engine(); a = self.actor(e); z = Zone(Band.ATT, Lane.CENTER)
                  a.player.preferred_foot = 'BOTH'
                  a.player.technique = 90
                  probs = e.body_part_probabilities(a, 'shoot', z, self.ctx(), source='open_play')
                  self.assertAlmostEqual(probs['right_foot'], probs['left_foot'], places=8)
                  self.assertEqual(e._part_category(a, 'right_foot'), 'preferred_foot')
                  self.assertEqual(e._part_category(a, 'left_foot'), 'preferred_foot')
                  for action in ('safe_pass', 'carry', 'shoot'):
                      right = e._part_execution_modifier(a, action, 'right_foot')
                      left = e._part_execution_modifier(a, action, 'left_foot')
                      self.assertAlmostEqual(right, left, places=8)

              def test_technique_improves_nonpreferred_foot_without_new_attribute(self):
                  e = self.engine(); a = self.actor(e); z = Zone(Band.ATT, Lane.CENTER)
                  a.player.preferred_foot = 'R'
                  a.player.technique = 45
                  low_mod = e._part_execution_modifier(a, 'shoot', 'left_foot')
                  low_prob = e.body_part_probabilities(a, 'shoot', z, self.ctx(), source='open_play')['left_foot']
                  a.player.technique = 95
                  high_mod = e._part_execution_modifier(a, 'shoot', 'left_foot')
                  high_prob = e.body_part_probabilities(a, 'shoot', z, self.ctx(), source='open_play')['left_foot']
                  self.assertGreater(high_mod, low_mod)
                  self.assertGreater(high_prob, low_prob)
          '''.replace('              ', '')
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          tests = tests.replace(marker, addition + marker, 1)
          t.write_text(tests)
          PY
      - name: Run focused legal-body tests
        run: python -m unittest -q test_v13_legal_body_actions.py
      - name: Run full regression suite
        run: python -m unittest -q
      - name: Commit tested integration
        run: |
          rm .github/workflows/one-time-two-footed-legal-body.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine_experiment_v13_legal_body.py test_v13_legal_body_actions.py .github/workflows/one-time-two-footed-legal-body.yml
          git commit -m "Model two-footed players through foot preference and technique"
          git push
