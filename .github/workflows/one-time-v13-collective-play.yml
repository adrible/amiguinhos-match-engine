          Path('engine_experiment_v13_duels.py').write_text(r'''from __future__ import annotations

"""v1.3 stage 5: shielding, body feints, physical duels and second balls."""

from engine import Band, Lane, PlayerState, Zone, clamp, weighted_choice
from engine_experiment_v13_pressing_triggers import MatchEngineV13PressingTriggers

VERSION = "1.3-candidate-duels-second-balls"


class MatchEngineV13Duels(MatchEngineV13PressingTriggers):
    def _ensure_duel_state(self):
        if not hasattr(self, "_v13_second_ball_selection"):
            self._v13_second_ball_selection = None

    def protection_diagnostic(self, actor: PlayerState, zone: Zone, ctx: dict) -> dict:
        pressure = clamp(float(ctx.get("pressure", 0.5)))
        body = self.body_orientation_diagnostic(actor, zone, ctx, source=getattr(self, "_v13_current_reception_source", "open_play"))
        back = 1.0 if body["stance"] == "back_to_goal" else 0.0
        strength = clamp(actor.effective("strength") / 100.0)
        composure = clamp(actor.effective("composure") / 100.0)
        technique = clamp(actor.effective("technique") / 100.0)
        score = clamp(0.18 + 0.30 * strength + 0.20 * composure + 0.15 * technique + 0.17 * pressure + 0.10 * back)
        return {"score": score, "active": pressure >= 0.45 and score >= 0.55, "stance": body["stance"]}

    def _decision_weights(self, actor, zone, tactics, ctx):
        items = super()._decision_weights(actor, zone, tactics, ctx)
        shield = self.protection_diagnostic(actor, zone, ctx)
        if not shield["active"]:
            return items
        out = []
        for action, weight in items:
            mod = 1.0
            if action == "safe_pass":
                mod = 1.10
            elif action == "carry":
                mod = 1.07
            elif action in {"shoot", "through_ball"} and shield["stance"] == "back_to_goal":
                mod = 0.93
            out.append((action, weight * mod))
        return out

    def _choose_target(self, team, zone, attacking=True, exclude=None):
        self._ensure_duel_state()
        marker = self._v13_second_ball_selection
        if marker and marker.get("team") == team and attacking:
            rows = []
            for ps in self.teams[team].on_field:
                if ps.player.name == exclude or ps.player.position.upper() == "GK" or ps.red:
                    continue
                score = (
                    0.34 * ps.effective("anticipation")
                    + 0.26 * ps.effective("positioning")
                    + 0.20 * ps.effective("off_ball")
                    + 0.12 * ps.effective("pace")
                    + 8.0 * ps.energy
                )
                rows.append((ps, max(1.0, score)))
            if rows:
                return weighted_choice(self.rng, rows)
        return super()._choose_target(team, zone, attacking=attacking, exclude=exclude)

    def _create_rebound(self, team, p, shooter, xg, blocked=False, post=False):
        self._ensure_duel_state()
        self._v13_second_ball_selection = {"team": team, "source": "rebound"}
        try:
            event = super()._create_rebound(team, p, shooter, xg, blocked=blocked, post=post)
        finally:
            self._v13_second_ball_selection = None
        event.data["second_ball_read"] = True
        next_name = event.data.get("next_player")
        if next_name:
            try:
                ps = self.teams[team].by_name(next_name)
                reaction = clamp((ps.effective("anticipation") + ps.effective("positioning") + ps.effective("off_ball")) / 300.0)
                event.data["second_ball_reaction"] = round(reaction, 3)
            except KeyError:
                pass
        return event

    def _physical_duel(self, team, actor, ctx):
        if float(ctx.get("pressure", 0.5)) < 0.52:
            return None
        defender_name = ctx.get("defensive_actor")
        if not defender_name:
            return None
        try:
            defender = self.teams[1 - team].by_name(defender_name)
        except KeyError:
            return None
        attack = 0.54 * actor.effective("strength") + 0.25 * actor.effective("composure") + 0.21 * actor.effective("technique")
        defend = 0.48 * defender.effective("strength") + 0.32 * defender.effective("tackling") + 0.20 * defender.effective("positioning")
        edge = clamp(0.5 + (attack - defend) / 160.0, 0.20, 0.80)
        return {"defender": defender_name, "attacker_edge": edge}

    def _execute_decision(self, team, actor, zone, decision, ctx):
        adjusted = dict(ctx)
        shield = self.protection_diagnostic(actor, zone, adjusted)
        annotations = {}
        if shield["active"] and decision in {"safe_pass", "carry", "dribble"}:
            score = shield["score"]
            adjusted["pressure"] = clamp(float(adjusted.get("pressure", 0.5)) - 0.025 * score)
            adjusted["space_behind"] = clamp(float(adjusted.get("space_behind", 0.4)) - 0.020 * score)
            annotations["shielding"] = True
            annotations["shielding_quality"] = round(score, 3)

        duel = None
        if decision in {"carry", "dribble"}:
            duel = self._physical_duel(team, actor, adjusted)
            if duel:
                edge = duel["attacker_edge"] - 0.5
                adjusted["pressure"] = clamp(float(adjusted.get("pressure", 0.5)) - 0.055 * edge)
                adjusted["space"] = clamp(float(adjusted.get("space", 0.5)) + 0.045 * edge)
                annotations["physical_duel"] = True
                annotations["duel_defender"] = duel["defender"]
                annotations["duel_attacker_edge"] = round(duel["attacker_edge"], 3)

        eligible_feint = decision in {"carry", "dribble", "shoot", "cross", "cutback", "through_ball", "progressive_pass"}
        pressure = clamp(float(adjusted.get("pressure", 0.5)))
        space = clamp(float(adjusted.get("space", 0.5)))
        if eligible_feint and 0.22 <= pressure <= 0.86:
            technique = clamp(actor.effective("technique") / 100.0)
            dribbling = clamp(actor.effective("dribbling") / 100.0)
            vision = clamp(actor.effective("vision") / 100.0)
            attempt_p = clamp(0.01 + 0.075 * technique + 0.065 * dribbling + 0.035 * vision + 0.025 * pressure - 0.035 * space, 0.01, 0.19)
            if self.rng.random() < attempt_p:
                defensive_quality = clamp(float(adjusted.get("defensive_quality", 0.55)))
                success_p = clamp(0.28 + 0.27 * technique + 0.20 * dribbling + 0.10 * vision - 0.22 * defensive_quality - 0.12 * pressure, 0.18, 0.78)
                success = self.rng.random() < success_p
                if success:
                    adjusted["pressure"] = clamp(pressure - 0.040)
                    adjusted["space"] = clamp(space + 0.030)
                else:
                    adjusted["pressure"] = clamp(pressure + 0.025)
                    adjusted["space"] = clamp(space - 0.015)
                annotations["body_feint"] = True
                annotations["body_feint_success"] = success
                annotations["body_feint_probability"] = round(attempt_p, 3)

        event = super()._execute_decision(team, actor, zone, decision, adjusted)
        for k, v in annotations.items():
            event.data.setdefault(k, v)
        return event


MatchEngine = MatchEngineV13Duels
''')

          Path('engine_experiment_v13_collective.py').write_text(r'''from __future__ import annotations

"""v1.3 stage 6: collective integration and rapid combination tempo."""

from engine import clamp
from engine_experiment_v13_duels import MatchEngineV13Duels

VERSION = "1.3-candidate-collective-play"


class MatchEngineV13Collective(MatchEngineV13Duels):
    def combination_clock_scale(self, possession_team: int | None = None) -> float:
        self._ensure_combination_state()
        team = self.state.possession if possession_team is None else possession_team
        actor = getattr(self, "_v13_current_open_actor", None)
        if not actor:
            return 1.0
        link = self._recent_link(team=team, actor_name=actor, max_age=12.0)
        if not link:
            return 1.0
        chain = self.active_pass_chain(team, max_age=16.0)
        if len(chain) >= 3:
            return 0.28
        if len(chain) == 2:
            return 0.38
        return 0.55

    def _advance_clock(self, seconds: float, possession_team: int):
        scale = self.combination_clock_scale(possession_team)
        try:
            return super()._advance_clock(seconds * scale, possession_team)
        finally:
            self._v13_current_open_actor = None

    def collective_diagnostic(self, team: int | None = None) -> dict:
        self._ensure_combination_state()
        selected = self.state.possession if team is None else team
        chain = self.active_pass_chain(selected, max_age=18.0)
        players = []
        if chain:
            players = [chain[0]["actor"]] + [row["target"] for row in chain]
        return {
            "team": selected,
            "chain_length": len(chain),
            "players": players[-6:],
            "rapid": len(chain) >= 2,
            "next_clock_scale": self.combination_clock_scale(selected),
        }

    def snapshot(self) -> dict:
        data = super().snapshot()
        data["v13_collective"] = self.collective_diagnostic(self.state.possession)
        return data


MatchEngine = MatchEngineV13Collective
''')

          Path('test_v13_collective_play.py').write_text(r'''from __future__ import annotations

import unittest

from engine import Band, Lane, Zone, make_generic_team
from engine_experiment_v13_collective import MatchEngineV13Collective
from engine_experiment_v13_combinations import MatchEngineV13Combinations
from engine_experiment_v13_runs import MatchEngineV13Runs
from engine_experiment_v13_thirdman import MatchEngineV13ThirdMan
from engine_experiment_v13_pressing_triggers import MatchEngineV13PressingTriggers
from engine_experiment_v13_duels import MatchEngineV13Duels


class CollectivePlayTests(unittest.TestCase):
    def engine(self, seed=303):
        return MatchEngineV13Collective(
            make_generic_team("Home", 80, "balanced", seed=101),
            make_generic_team("Away", 80, "balanced", seed=202),
            seed=seed,
        )

    def actor(self, e, team=0):
        return next(ps for ps in e.teams[team].on_field if ps.player.position not in {"GK", "CB"})

    def ctx(self, pressure=0.42, space=0.58):
        return {"pressure": pressure, "space": space, "space_behind": 0.56, "support": 0.60, "defensive_quality": 0.55}

    def test_layer_order(self):
        self.assertTrue(issubclass(MatchEngineV13Runs, MatchEngineV13Combinations))
        self.assertTrue(issubclass(MatchEngineV13ThirdMan, MatchEngineV13Runs))
        self.assertTrue(issubclass(MatchEngineV13PressingTriggers, MatchEngineV13ThirdMan))
        self.assertTrue(issubclass(MatchEngineV13Duels, MatchEngineV13PressingTriggers))
        self.assertTrue(issubclass(MatchEngineV13Collective, MatchEngineV13Duels))

    def test_quick_combination_memory_and_roundtrip(self):
        e = self.engine()
        a = self.actor(e)
        b = next(ps for ps in e.teams[0].on_field if ps.player.name != a.player.name and ps.player.position != "GK")
        e._v13_combination_history = [{"team": 0, "actor": a.player.name, "target": b.player.name, "second": e.state.second, "kind": "safe_pass", "first_time": False}]
        diag = e.quick_combination_diagnostic(b, 0)
        self.assertTrue(diag["active"])
        self.assertEqual(diag["return_target"], a.player.name)
        clone = MatchEngineV13Collective.from_json(e.export_json())
        self.assertEqual(clone._v13_combination_history, e._v13_combination_history)

    def test_run_diagnostic_finds_space_runner(self):
        e = self.engine()
        a = self.actor(e)
        d = e.run_diagnostic(0, a, Zone(Band.ATT, Lane.LEFT), self.ctx())
        self.assertTrue(d["runner"])
        self.assertIn(d["run_type"], {"overlap", "underlap", "diagonal", "depth", "third_line", "support"})
        self.assertGreater(d["pass_into_space_probability"], 0.0)

    def test_third_man_diagnostic_excludes_originator_and_connector(self):
        e = self.engine()
        players = [ps for ps in e.teams[0].on_field if ps.player.position != "GK"]
        a, b = players[0], players[1]
        e._v13_combination_history = [{"team": 0, "actor": a.player.name, "target": b.player.name, "second": e.state.second, "kind": "progressive_pass", "first_time": False}]
        d = e.third_man_diagnostic(0, b.player.name)
        self.assertTrue(d["candidate"])
        self.assertNotIn(d["candidate"], {a.player.name, b.player.name})

    def test_pressing_trigger_has_depth_tradeoff(self):
        e = self.engine()
        e.teams[1].team.tactics.pressing = 0.85
        e._emit(type(e.state.event_log).__mro__[0] if False else __import__('engine').EventType.INFO, 0, 0, "safe_pass", actor="A", target="B", first_touch="heavy")
        d = e.pressing_trigger_diagnostic(0, Zone(Band.MID, Lane.CENTER))
        self.assertTrue(d["active"])
        self.assertEqual(d["trigger"], "heavy_touch")
        self.assertGreater(d["pressure_delta"], 0.0)
        self.assertGreater(d["depth_tradeoff"], 0.0)

    def test_steering_does_not_treat_both_as_weak_foot(self):
        e = self.engine()
        a = self.actor(e)
        a.player.preferred_foot = "BOTH"
        d = e.steering_diagnostic(a, Zone(Band.ATT, Lane.RIGHT), self.ctx())
        self.assertNotEqual(d["intent"], "weak_foot")

    def test_protection_responds_to_strength_and_pressure(self):
        e = self.engine()
        a = self.actor(e)
        a.player.strength = 95
        high = e.protection_diagnostic(a, Zone(Band.ATT, Lane.CENTER), self.ctx(0.75, 0.35))
        a.player.strength = 45
        low = e.protection_diagnostic(a, Zone(Band.ATT, Lane.CENTER), self.ctx(0.20, 0.75))
        self.assertGreater(high["score"], low["score"])

    def test_rapid_chain_shortens_clock_without_zero_time(self):
        e = self.engine()
        names = [ps.player.name for ps in e.teams[0].on_field if ps.player.position != "GK"][:4]
        e._v13_combination_history = [
            {"team": 0, "actor": names[0], "target": names[1], "second": 100.0, "kind": "safe_pass", "first_time": True},
            {"team": 0, "actor": names[1], "target": names[2], "second": 104.0, "kind": "progressive_pass", "first_time": True},
            {"team": 0, "actor": names[2], "target": names[3], "second": 108.0, "kind": "safe_pass", "first_time": False},
        ]
        e.state.second = 108.0
        e.state.possession = 0
        e._v13_current_open_actor = names[3]
        scale = e.combination_clock_scale(0)
        self.assertGreater(scale, 0.20)
        self.assertLess(scale, 0.50)

    def test_canonical_entrypoint_is_collective(self):
        from engine_experiment_v13 import MatchEngine
        self.assertIs(MatchEngine, MatchEngineV13Collective)

    def test_generic_smoke_is_deterministic(self):
        a = self.engine(seed=909)
        b = self.engine(seed=909)
        sig_a, sig_b = [], []
        for _ in range(30):
            ea = a.step(); eb = b.step()
            sig_a.append((ea.minute, ea.type.value, ea.text_key, ea.team, ea.data))
            sig_b.append((eb.minute, eb.type.value, eb.text_key, eb.team, eb.data))
        self.assertEqual(sig_a, sig_b)

    def test_save_load_continuation_is_deterministic(self):
        e = self.engine(seed=777)
        for _ in range(18):
            e.step()
        clone = MatchEngineV13Collective.from_json(e.export_json())
        out1, out2 = [], []
        for _ in range(12):
            a = e.step(); b = clone.step()
            out1.append((a.minute, a.type.value, a.text_key, a.team, a.data))
            out2.append((b.minute, b.type.value, b.text_key, b.team, b.data))
        self.assertEqual(out1, out2)


if __name__ == "__main__":
    unittest.main()
''')

