name: One-time v1.3 collective play integration
on:
  push:
    branches: [v1.3-spatial-creativity-boldness]
    paths:
      - '.github/workflows/one-time-v13-collective-play.yml'
permissions:
  contents: write

jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3-spatial-creativity-boldness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build six collective-play layers
        run: |
          python - <<'PY'
          from pathlib import Path

          Path('engine_experiment_v13_combinations.py').write_text(r'''from __future__ import annotations

"""v1.3 stage 1: quick combinations and short play memory.

The layer does not hard-code a "one-two" command. A give-and-go can emerge when
one player passes, the receiver is selected again quickly, and contextual skill
makes a fast return pass attractive. The same seed/state remains deterministic.
"""

from engine import EventType, PlayerState, Zone, clamp
from engine_experiment_v13_adaptation_inertia import MatchEngineV13AdaptationInertia

VERSION = "1.3-candidate-quick-combinations"

_PASS_KEYS = {
    "safe_pass", "progression", "progression_creates_danger", "danger_created"
}
_BREAK_TYPES = {
    EventType.TURNOVER, EventType.FOUL, EventType.OFFSIDE,
    EventType.PERIOD_END, EventType.MATCH_END,
}


class MatchEngineV13Combinations(MatchEngineV13AdaptationInertia):
    def _ensure_combination_state(self) -> None:
        if not hasattr(self, "_v13_combination_history"):
            self._v13_combination_history = []
        if not hasattr(self, "_v13_current_open_actor"):
            self._v13_current_open_actor = None
        if not hasattr(self, "_v13_combo_target_hint"):
            self._v13_combo_target_hint = None

    def export_state(self) -> dict:
        data = super().export_state()
        self._ensure_combination_state()
        data["v13_combination_history"] = [dict(x) for x in self._v13_combination_history]
        return data

    @classmethod
    def from_state_dict(cls, data: dict):
        obj = super().from_state_dict(data)
        obj._v13_combination_history = [dict(x) for x in data.get("v13_combination_history", [])]
        obj._v13_current_open_actor = None
        obj._v13_combo_target_hint = None
        return obj

    @staticmethod
    def _pass_endpoints(event):
        actor = event.data.get("actor") or event.data.get("creator")
        target = event.data.get("target") or event.data.get("receiver")
        if event.text_key not in _PASS_KEYS or not actor or not target or actor == target:
            return None
        return actor, target

    def _recent_link(self, *, team=None, actor_name=None, max_age=10.0):
        self._ensure_combination_state()
        if not self._v13_combination_history:
            return None
        row = self._v13_combination_history[-1]
        if team is not None and row["team"] != team:
            return None
        if actor_name is not None and row["target"] != actor_name:
            return None
        if self.state.second - float(row["second"]) > max_age:
            return None
        return row

    def active_pass_chain(self, team=None, max_age=18.0) -> list[dict]:
        self._ensure_combination_state()
        rows = self._v13_combination_history
        if not rows:
            return []
        chain = [rows[-1]]
        if team is not None and chain[0]["team"] != team:
            return []
        for row in reversed(rows[:-1]):
            newest = chain[0]
            if row["team"] != newest["team"]:
                break
            if float(newest["second"]) - float(row["second"]) > max_age:
                break
            if row["target"] != newest["actor"]:
                break
            chain.insert(0, row)
        return chain

    def quick_combination_diagnostic(self, actor: PlayerState, team: int) -> dict:
        link = self._recent_link(team=team, actor_name=actor.player.name, max_age=12.0)
        if not link:
            return {"active": False, "return_target": None, "continuity": 0.0}
        technique = clamp(actor.effective("technique") / 100.0)
        vision = clamp(actor.effective("vision") / 100.0)
        anticipation = clamp(actor.effective("anticipation") / 100.0)
        composure = clamp(actor.effective("composure") / 100.0)
        continuity = clamp(0.26 + 0.20 * technique + 0.18 * vision + 0.16 * anticipation + 0.12 * composure)
        return {
            "active": True,
            "return_target": link["actor"],
            "source_kind": link.get("kind", "pass"),
            "age": max(0.0, self.state.second - float(link["second"])),
            "continuity": continuity,
        }

    def _choose_actor(self, team: int, zone: Zone):
        self._ensure_combination_state()
        link = self._recent_link(team=team, max_age=12.0)
        if link:
            try:
                receiver = self.teams[team].by_name(link["target"])
            except KeyError:
                receiver = None
            if receiver is not None and not receiver.red:
                technique = clamp(receiver.effective("technique") / 100.0)
                anticipation = clamp(receiver.effective("anticipation") / 100.0)
                continuity_p = clamp(0.48 + 0.18 * technique + 0.12 * anticipation, 0.48, 0.78)
                if self.rng.random() < continuity_p:
                    self._v13_current_open_actor = receiver.player.name
                    return receiver
        actor = super()._choose_actor(team, zone)
        self._v13_current_open_actor = actor.player.name
        return actor

    def _first_time_probability(self, actor: PlayerState, action: str, diag: dict) -> float:
        base = super()._first_time_probability(actor, action, diag)
        team = self.state.possession
        quick = self.quick_combination_diagnostic(actor, team)
        if not quick["active"] or base <= 0.0:
            return base
        technique = clamp(actor.effective("technique") / 100.0)
        passing = clamp(actor.effective("passing") / 100.0)
        boost = 0.035 + 0.075 * technique + 0.045 * passing
        return clamp(base + boost, 0.0, 0.72)

    def _choose_target(self, team, zone, attacking=True, exclude=None):
        self._ensure_combination_state()
        if attacking and exclude:
            try:
                actor = self.teams[team].by_name(exclude)
            except KeyError:
                actor = None
            if actor is not None:
                quick = self.quick_combination_diagnostic(actor, team)
                return_name = quick.get("return_target")
                if quick.get("active") and return_name and return_name != exclude:
                    try:
                        candidate = self.teams[team].by_name(return_name)
                    except KeyError:
                        candidate = None
                    if candidate is not None and candidate.player.position.upper() != "GK":
                        off_ball = clamp(candidate.effective("off_ball") / 100.0)
                        p = clamp(0.05 + 0.30 * quick["continuity"] + 0.12 * off_ball, 0.08, 0.43)
                        if self.rng.random() < p:
                            self._v13_combo_target_hint = {
                                "actor": exclude, "target": return_name,
                                "kind": "give_and_go", "probability": p,
                            }
                            return candidate
        return super()._choose_target(team, zone, attacking=attacking, exclude=exclude)

    def _execute_decision(self, team, actor, zone, decision, ctx):
        self._ensure_combination_state()
        quick = self.quick_combination_diagnostic(actor, team)
        adjusted = dict(ctx)
        if quick["active"]:
            adjusted["support"] = clamp(float(adjusted.get("support", 0.5)) + 0.035 * quick["continuity"])
            adjusted["space"] = clamp(float(adjusted.get("space", 0.5)) + 0.018 * quick["continuity"])
        try:
            event = super()._execute_decision(team, actor, zone, decision, adjusted)
        finally:
            hint = self._v13_combo_target_hint
            self._v13_combo_target_hint = None
        if quick["active"]:
            event.data.setdefault("quick_combination", True)
            event.data.setdefault("combination_return_option", quick.get("return_target"))
        if hint and event.data.get("target") == hint.get("target"):
            event.data["give_and_go"] = True
            event.data["give_and_go_probability"] = round(float(hint["probability"]), 3)
        return event

    def _emit(self, typ, team, relevance, text_key, **data):
        self._ensure_combination_state()
        prior = self._v13_combination_history[-1] if self._v13_combination_history else None
        event = super()._emit(typ, team, relevance, text_key, **data)
        endpoints = self._pass_endpoints(event)
        if endpoints and team in (0, 1):
            actor, target = endpoints
            quick = bool(
                prior and prior["team"] == team and prior["target"] == actor
                and self.state.second - float(prior["second"]) <= 12.0
            )
            row = {
                "team": team, "actor": actor, "target": target,
                "second": float(self.state.second),
                "kind": event.data.get("kind") or text_key,
                "first_time": bool(event.data.get("first_time")),
            }
            self._v13_combination_history.append(row)
            self._v13_combination_history = self._v13_combination_history[-8:]
            if quick:
                event.data["quick_sequence"] = True
                event.data["quick_sequence_link"] = f"{actor}->{target}"
        elif typ in _BREAK_TYPES:
            self._v13_combination_history = []
        return event


MatchEngine = MatchEngineV13Combinations
''')

          Path('engine_experiment_v13_runs.py').write_text(r'''from __future__ import annotations

"""v1.3 stage 2: passes into space and coordinated runs."""

from engine import Band, Lane, PlayerState, Zone, clamp
from engine_experiment_v13_combinations import MatchEngineV13Combinations

VERSION = "1.3-candidate-coordinated-runs"


class MatchEngineV13Runs(MatchEngineV13Combinations):
    def _ensure_run_state(self):
        if not hasattr(self, "_v13_forced_space_target"):
            self._v13_forced_space_target = None
        if not hasattr(self, "_v13_active_run_plan"):
            self._v13_active_run_plan = None

    @staticmethod
    def _run_type_for(ps: PlayerState, zone: Zone) -> tuple[str, float]:
        pos = ps.player.position.upper()
        if zone.lane != Lane.CENTER:
            if pos in {"LB", "RB"}:
                return "overlap", 1.14
            if pos in {"CM", "DM", "AM"}:
                return "underlap", 1.06
            if pos in {"LW", "RW"}:
                return "diagonal", 1.08
            if pos == "ST":
                return "depth", 1.12
        else:
            if pos == "ST":
                return "depth", 1.18
            if pos in {"LW", "RW"}:
                return "diagonal", 1.12
            if pos == "AM":
                return "third_line", 1.08
        return "support", 0.86

    def run_diagnostic(self, team: int, actor: PlayerState, zone: Zone, ctx: dict | None = None) -> dict:
        context = dict(ctx or {"pressure": 0.5, "space": 0.5, "space_behind": 0.4, "support": 0.5})
        pressure = clamp(float(context.get("pressure", 0.5)))
        behind = clamp(float(context.get("space_behind", 0.4)))
        rows = []
        for ps in self.teams[team].on_field:
            if ps.player.name == actor.player.name or ps.player.position.upper() == "GK" or ps.red:
                continue
            run_type, affinity = self._run_type_for(ps, zone)
            quality = clamp(
                affinity * (
                    0.30 * ps.effective("off_ball") / 100.0
                    + 0.22 * ps.effective("anticipation") / 100.0
                    + 0.22 * ps.effective("pace") / 100.0
                    + 0.10 * ps.effective("stamina") / 100.0
                    + 0.08 * ps.effective("composure") / 100.0
                    + 0.08 * ps.energy
                )
                + 0.10 * behind - 0.08 * pressure
            )
            rows.append((quality, ps.player.name, run_type))
        if not rows:
            return {"available": False, "runner": None, "run_type": None, "quality": 0.0}
        quality, name, run_type = max(rows)
        vision = clamp(actor.effective("vision") / 100.0)
        passing = clamp(actor.effective("passing") / 100.0)
        probability = clamp(0.03 + 0.22 * quality + 0.12 * vision + 0.08 * passing + 0.08 * behind - 0.10 * pressure, 0.04, 0.46)
        return {
            "available": quality >= 0.42,
            "runner": name,
            "run_type": run_type,
            "quality": quality,
            "pass_into_space_probability": probability,
        }

    def _prepare_space_run(self, team, actor, zone, ctx, kind):
        self._ensure_run_state()
        plan = self.run_diagnostic(team, actor, zone, ctx)
        if (
            plan["available"] and kind in {"progressive_pass", "switch", "long_ball", "through_ball", "cross", "cutback"}
            and self.rng.random() < plan["pass_into_space_probability"]
        ):
            self._v13_forced_space_target = {
                "team": team, "actor": actor.player.name, "target": plan["runner"], "kind": kind,
            }
            self._v13_active_run_plan = plan
            return plan
        self._v13_forced_space_target = None
        self._v13_active_run_plan = None
        return None

    def _choose_target(self, team, zone, attacking=True, exclude=None):
        self._ensure_run_state()
        marker = self._v13_forced_space_target
        if attacking and marker and marker.get("team") == team and marker.get("actor") == exclude:
            try:
                return self.teams[team].by_name(marker["target"])
            except KeyError:
                pass
        return super()._choose_target(team, zone, attacking=attacking, exclude=exclude)

    @staticmethod
    def _apply_run_context(ctx: dict, plan: dict | None) -> dict:
        if not plan:
            return dict(ctx)
        adjusted = dict(ctx)
        q = float(plan["quality"])
        adjusted["support"] = clamp(float(adjusted.get("support", 0.5)) + 0.035 * q)
        adjusted["space_behind"] = clamp(float(adjusted.get("space_behind", 0.4)) + 0.055 * q)
        return adjusted

    @staticmethod
    def _annotate_run(event, plan):
        if plan:
            event.data["pass_into_space"] = True
            event.data["run_target"] = plan["runner"]
            event.data["run_type"] = plan["run_type"]
            event.data["run_quality"] = round(float(plan["quality"]), 3)

    def _progressive_action(self, team, actor, zone, kind, ctx):
        plan = self._prepare_space_run(team, actor, zone, ctx, kind)
        try:
            event = super()._progressive_action(team, actor, zone, kind, self._apply_run_context(ctx, plan))
            self._annotate_run(event, plan)
            return event
        finally:
            self._v13_forced_space_target = None
            self._v13_active_run_plan = None

    def _create_or_resolve_danger(self, team, actor, zone, kind, ctx):
        plan = self._prepare_space_run(team, actor, zone, ctx, kind)
        try:
            event = super()._create_or_resolve_danger(team, actor, zone, kind, self._apply_run_context(ctx, plan))
            self._annotate_run(event, plan)
            return event
        finally:
            self._v13_forced_space_target = None
            self._v13_active_run_plan = None


MatchEngine = MatchEngineV13Runs
''')

          Path('engine_experiment_v13_thirdman.py').write_text(r'''from __future__ import annotations

"""v1.3 stage 3: third-man patterns and multi-player combination chains."""

from engine import clamp
from engine_experiment_v13_runs import MatchEngineV13Runs

VERSION = "1.3-candidate-third-man"


class MatchEngineV13ThirdMan(MatchEngineV13Runs):
    def _ensure_third_man_state(self):
        if not hasattr(self, "_v13_third_man_hint"):
            self._v13_third_man_hint = None

    def third_man_diagnostic(self, team: int, actor_name: str) -> dict:
        self._ensure_combination_state()
        link = self._recent_link(team=team, actor_name=actor_name, max_age=12.0)
        if not link:
            return {"available": False, "candidate": None, "probability": 0.0}
        try:
            actor = self.teams[team].by_name(actor_name)
        except KeyError:
            return {"available": False, "candidate": None, "probability": 0.0}
        rows = []
        for ps in self.teams[team].on_field:
            name = ps.player.name
            if name in {actor_name, link["actor"]} or ps.player.position.upper() == "GK" or ps.red:
                continue
            score = clamp(
                0.31 * ps.effective("off_ball") / 100.0
                + 0.24 * ps.effective("anticipation") / 100.0
                + 0.18 * ps.effective("pace") / 100.0
                + 0.12 * ps.effective("technique") / 100.0
                + 0.08 * ps.effective("composure") / 100.0
                + 0.07 * ps.energy
            )
            rows.append((score, name))
        if not rows:
            return {"available": False, "candidate": None, "probability": 0.0}
        score, candidate = max(rows)
        vision = clamp(actor.effective("vision") / 100.0)
        passing = clamp(actor.effective("passing") / 100.0)
        probability = clamp(0.03 + 0.22 * score + 0.12 * vision + 0.08 * passing, 0.05, 0.39)
        return {
            "available": score >= 0.48,
            "candidate": candidate,
            "probability": probability,
            "originator": link["actor"],
            "connector": actor_name,
            "quality": score,
        }

    def _choose_target(self, team, zone, attacking=True, exclude=None):
        self._ensure_third_man_state()
        marker = getattr(self, "_v13_forced_space_target", None)
        if marker and marker.get("team") == team and marker.get("actor") == exclude:
            return super()._choose_target(team, zone, attacking=attacking, exclude=exclude)
        if attacking and exclude:
            diag = self.third_man_diagnostic(team, exclude)
            if diag["available"] and self.rng.random() < diag["probability"]:
                try:
                    candidate = self.teams[team].by_name(diag["candidate"])
                except KeyError:
                    candidate = None
                if candidate is not None:
                    self._v13_third_man_hint = diag
                    return candidate
        return super()._choose_target(team, zone, attacking=attacking, exclude=exclude)

    def _execute_decision(self, team, actor, zone, decision, ctx):
        chain = self.active_pass_chain(team)
        adjusted = dict(ctx)
        if chain and chain[-1]["target"] == actor.player.name:
            length = len(chain)
            if length >= 2:
                adjusted["support"] = clamp(float(adjusted.get("support", 0.5)) + min(0.055, 0.018 * length))
                adjusted["space"] = clamp(float(adjusted.get("space", 0.5)) + min(0.035, 0.011 * length))
        event = super()._execute_decision(team, actor, zone, decision, adjusted)
        fresh = self.active_pass_chain(team)
        if len(fresh) >= 2:
            players = [fresh[0]["actor"]] + [x["target"] for x in fresh]
            event.data.setdefault("combination_length", len(fresh))
            event.data.setdefault("combination_players", players[-5:])
        hint = self._v13_third_man_hint
        self._v13_third_man_hint = None
        if hint and (event.data.get("target") or event.data.get("receiver")) == hint.get("candidate"):
            event.data["third_man_run"] = True
            event.data["third_man_originator"] = hint["originator"]
            event.data["third_man_connector"] = hint["connector"]
        return event

    def _emit(self, typ, team, relevance, text_key, **data):
        prior = None
        self._ensure_combination_state()
        if self._v13_combination_history:
            prior = dict(self._v13_combination_history[-1])
        event = super()._emit(typ, team, relevance, text_key, **data)
        endpoints = self._pass_endpoints(event)
        if prior and endpoints and prior["team"] == team:
            actor, target = endpoints
            if prior["target"] == actor and target not in {prior["actor"], actor}:
                event.data["third_man"] = True
                event.data["third_man_pattern"] = [prior["actor"], actor, target]
        chain = self.active_pass_chain(team) if team in (0, 1) else []
        if len(chain) >= 2:
            event.data.setdefault("rapid_chain", True)
            event.data.setdefault("rapid_chain_length", min(5, len(chain)))
        return event


MatchEngine = MatchEngineV13ThirdMan
''')

          Path('engine_experiment_v13_pressing_triggers.py').write_text(r'''from __future__ import annotations

"""v1.3 stage 4: pressing triggers and defensive steering.

The trigger is not a second defensive buff stack. It adds a small immediate
pressure response and an explicit depth trade-off: jumping to press can open
space behind. Steering can bias a one-footed attacker toward the less natural
foot, but never forces the outcome.
"""

from engine import Band, Lane, PlayerState, Zone, clamp
from engine_experiment_v13_thirdman import MatchEngineV13ThirdMan

VERSION = "1.3-candidate-pressing-triggers"


class MatchEngineV13PressingTriggers(MatchEngineV13ThirdMan):
    def _ensure_press_state(self):
        if not hasattr(self, "_v13_steering_context"):
            self._v13_steering_context = None

    def pressing_trigger_diagnostic(self, attacking_team: int, zone: Zone) -> dict:
        defending_team = 1 - attacking_team
        pressing = clamp(self.teams[defending_team].team.tactics.pressing)
        last = self.state.event_log[-1] if self.state.event_log else None
        trigger = None
        severity = 0.0
        if last is not None:
            touch = last.data.get("first_touch")
            if touch == "miscontrol":
                trigger, severity = "miscontrol", 1.0
            elif touch == "heavy":
                trigger, severity = "heavy_touch", 0.88
            elif touch == "loose":
                trigger, severity = "loose_touch", 0.72
            elif last.type.value == "rebound":
                trigger, severity = "second_ball", 0.82
            elif last.text_key == "safe_pass" and zone.band in {Band.DEF, Band.MID}:
                trigger, severity = "safe_recycle", 0.46
            elif last.data.get("reception_mode") == "controlled" and last.data.get("oriented_touch") == "secure":
                trigger, severity = "receiver_closed", 0.40
        active = bool(trigger and pressing >= 0.30)
        pressure_delta = clamp((0.012 + 0.055 * severity) * pressing, 0.0, 0.060) if active else 0.0
        return {
            "active": active,
            "trigger": trigger,
            "severity": severity,
            "pressing": pressing,
            "pressure_delta": pressure_delta,
            "depth_tradeoff": pressure_delta * 0.90,
        }

    def steering_diagnostic(self, actor: PlayerState, zone: Zone, ctx: dict) -> dict:
        footedness = self._footedness(actor)
        defensive_quality = clamp(float(ctx.get("defensive_quality", 0.55)))
        pressure = clamp(float(ctx.get("pressure", 0.5)))
        attacker_escape = clamp((actor.effective("dribbling") + actor.effective("technique")) / 200.0)
        quality = clamp(0.38 + 0.34 * defensive_quality + 0.16 * pressure - 0.22 * attacker_escape, 0.18, 0.78)
        if footedness == "B":
            intent = "force_line" if zone.lane != Lane.CENTER else "contain"
        else:
            intent = "weak_foot"
        return {"intent": intent, "quality": quality, "footedness": footedness}

    def _spatial_context(self, attacking_team: int, zone: Zone) -> dict:
        ctx = super()._spatial_context(attacking_team, zone)
        diag = self.pressing_trigger_diagnostic(attacking_team, zone)
        if diag["active"]:
            delta = diag["pressure_delta"]
            ctx["pressure"] = clamp(float(ctx.get("pressure", 0.5)) + delta)
            ctx["space"] = clamp(float(ctx.get("space", 0.5)) - 0.42 * delta)
            ctx["space_behind"] = clamp(float(ctx.get("space_behind", 0.4)) + diag["depth_tradeoff"])
            ctx["pressing_trigger"] = diag["trigger"]
            ctx["pressing_trigger_delta"] = delta
        return ctx

    def body_part_probabilities(self, actor, action, zone, ctx=None, *, source="open_play"):
        probs = super().body_part_probabilities(actor, action, zone, ctx, source=source)
        marker = getattr(self, "_v13_steering_context", None)
        if not marker or marker.get("actor") != actor.player.name or marker.get("intent") != "weak_foot":
            return probs
        if self._footedness(actor) == "B":
            return probs
        preferred, weak = self._preferred_and_weak_foot(actor)
        q = float(marker.get("quality", 0.0))
        tuned = dict(probs)
        tuned[preferred] *= max(0.64, 1.0 - 0.28 * q)
        tuned[weak] *= 1.0 + 0.48 * q
        total = sum(tuned.values()) or 1.0
        return {k: v / total for k, v in tuned.items()}

    def _execute_decision(self, team, actor, zone, decision, ctx):
        press = self.pressing_trigger_diagnostic(team, zone)
        steering = self.steering_diagnostic(actor, zone, ctx)
        adjusted = dict(ctx)
        if decision in {"carry", "dribble", "shoot", "cross", "cutback"}:
            q = steering["quality"]
            adjusted["pressure"] = clamp(float(adjusted.get("pressure", 0.5)) + 0.018 * q)
            adjusted["space_behind"] = clamp(float(adjusted.get("space_behind", 0.4)) + 0.016 * q)
        self._v13_steering_context = {
            "actor": actor.player.name,
            "intent": steering["intent"],
            "quality": steering["quality"],
        }
        try:
            event = super()._execute_decision(team, actor, zone, decision, adjusted)
        finally:
            self._v13_steering_context = None
        if press["active"]:
            event.data.setdefault("pressing_trigger", press["trigger"])
            event.data.setdefault("pressing_trigger_strength", round(float(press["pressure_delta"]), 3))
            event.data.setdefault("pressing_depth_tradeoff", round(float(press["depth_tradeoff"]), 3))
        if decision in {"carry", "dribble", "shoot", "cross", "cutback"}:
            event.data.setdefault("defensive_steering", steering["intent"])
            event.data.setdefault("steering_quality", round(float(steering["quality"]), 3))
        return event


MatchEngine = MatchEngineV13PressingTriggers
