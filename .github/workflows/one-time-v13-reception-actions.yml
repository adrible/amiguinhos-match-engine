name: One-time v1.3 reception actions integration
on:
  push:
    branches: [v1.3-spatial-creativity-boldness]
    paths:
      - '.github/workflows/one-time-v13-reception-actions.yml'
permissions:
  contents: write
jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3-spatial-creativity-boldness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add reception, first-touch and one-touch layer
        run: |
          cat > engine_experiment_v13_reception.py <<'PYCODE'
          from __future__ import annotations

          """v1.3 layer: contextual first touch, oriented reception and one-touch play.

          The layer adds no new player attributes. Reception quality emerges from the
          existing technique, composure, anticipation, vision, dribbling, body
          orientation, pressure, space, incoming trajectory and legal contact surface.

          A player may either control the ball before acting or execute an eligible
          action first-time. Bad touches alter the footballing context and can very
          occasionally concede possession; good touches create time/space rather than a
          hidden attribute bonus.
          """

          from typing import Optional

          from engine import Band, Lane, PlayerState, Zone, clamp, weighted_choice
          from engine_experiment_v13_legal_body import MatchEngineV13LegalBody


          VERSION = "1.3-candidate-contextual-reception"


          class MatchEngineV13Reception(MatchEngineV13LegalBody):
              ONE_TOUCH_ACTIONS = {
                  "safe_pass", "progressive_pass", "switch", "long_ball",
                  "through_ball", "cross", "cutback", "shoot",
              }

              def _ensure_reception_state(self) -> None:
                  if not hasattr(self, "_v13_reception_context"):
                      self._v13_reception_context = None
                  if not hasattr(self, "_v13_reception_resolution"):
                      self._v13_reception_resolution = None
                  if not hasattr(self, "_v13_pending_reception"):
                      self._v13_pending_reception = None

              def export_state(self) -> dict:
                  data = super().export_state()
                  self._ensure_reception_state()
                  data["v13_pending_reception"] = self._v13_pending_reception
                  return data

              @classmethod
              def from_state_dict(cls, data: dict):
                  obj = super().from_state_dict(data)
                  obj._v13_reception_context = None
                  obj._v13_reception_resolution = None
                  obj._v13_pending_reception = data.get("v13_pending_reception")
                  return obj

              @staticmethod
              def _incoming_speed(source: str) -> float:
                  return {
                      "corner": 0.66,
                      "cross": 0.76,
                      "free_kick": 0.72,
                      "long_ball": 0.74,
                      "rebound": 0.88,
                      "switch": 0.60,
                      "progression": 0.54,
                      "progressive_pass": 0.58,
                      "safe_pass": 0.34,
                      "through_ball": 0.76,
                      "cutback": 0.70,
                      "carry": 0.20,
                      "dribble": 0.22,
                      "transition": 0.66,
                      "open_play": 0.46,
                  }.get((source or "open_play").lower(), 0.46)

              def _peek_reception_source(self, actor: PlayerState, zone: Zone) -> str:
                  marker = getattr(self, "_v13_reception_marker", None)
                  if not isinstance(marker, dict):
                      return "open_play"
                  if marker.get("target") != actor.player.name or marker.get("zone") != zone:
                      return "open_play"
                  return str(marker.get("source") or "open_play")

              def reception_diagnostic(
                  self,
                  actor: PlayerState,
                  zone: Zone,
                  ctx: Optional[dict] = None,
                  *,
                  source: str = "open_play",
              ) -> dict:
                  context = dict(ctx or {
                      "pressure": 0.50,
                      "space": 0.50,
                      "space_behind": 0.40,
                      "support": 0.50,
                  })
                  pressure = clamp(float(context.get("pressure", 0.5)))
                  space = clamp(float(context.get("space", 0.5)))
                  support = clamp(float(context.get("support", 0.5)))
                  height = self._incoming_height(source)
                  speed = self._incoming_speed(source)

                  technique = clamp(actor.effective("technique") / 100.0)
                  composure = clamp(actor.effective("composure") / 100.0)
                  anticipation = clamp(actor.effective("anticipation") / 100.0)
                  vision = clamp(actor.effective("vision") / 100.0)
                  dribbling = clamp(actor.effective("dribbling") / 100.0)
                  strength = clamp(actor.effective("strength") / 100.0)
                  body = self.body_orientation_diagnostic(actor, zone, context, source=source)

                  incoming_difficulty = clamp(
                      0.10
                      + 0.30 * speed
                      + 0.25 * height
                      + 0.18 * pressure
                      + 0.10 * (1.0 - space)
                  )
                  scan_score = clamp(
                      0.42 * vision + 0.30 * anticipation + 0.18 * composure
                      + 0.10 * float(body["open_body"])
                  )
                  control_score = clamp(
                      0.31 * technique
                      + 0.19 * composure
                      + 0.14 * anticipation
                      + 0.12 * dribbling
                      + 0.08 * float(body["open_body"])
                      + 0.07 * space
                      + 0.05 * (1.0 - pressure)
                      + 0.04 * support
                      - 0.16 * incoming_difficulty
                  )

                  forward = float(body["forward_view"])
                  open_body = float(body["open_body"])
                  back_to_goal = 1.0 if body["stance"] == "back_to_goal" else 0.0
                  intent_scores = {
                      "forward": (
                          0.38 * forward + 0.24 * space + 0.17 * scan_score
                          + 0.13 * control_score - 0.14 * pressure
                      ),
                      "protect": (
                          0.39 * pressure + 0.23 * (1.0 - forward)
                          + 0.17 * strength + 0.13 * back_to_goal
                          + 0.08 * (1.0 - space)
                      ),
                      "half_turn": (
                          0.32 * open_body + 0.25 * scan_score + 0.20 * control_score
                          + 0.13 * space - 0.10 * pressure
                      ),
                      "settle": (
                          0.25 * (1.0 - control_score) + 0.20 * incoming_difficulty
                          + 0.17 * pressure + 0.10 * (1.0 - scan_score)
                      ),
                  }

                  if zone.lane != Lane.CENTER:
                      footedness = self._footedness(actor)
                      natural_line = (
                          footedness == "B"
                          or (zone.lane == Lane.LEFT and footedness == "L")
                          or (zone.lane == Lane.RIGHT and footedness == "R")
                      )
                      intent_scores["wide_line"] = (
                          0.27 * open_body + 0.22 * space + 0.18 * control_score
                          + 0.12 * scan_score + (0.13 if natural_line else 0.04)
                      )
                      intent_scores["wide_inside"] = (
                          0.29 * open_body + 0.20 * forward + 0.18 * control_score
                          + 0.14 * scan_score + (0.12 if not natural_line else 0.05)
                      )

                  intent = max(intent_scores, key=intent_scores.get)
                  return {
                      "source": source,
                      "incoming_height": height,
                      "incoming_speed": speed,
                      "incoming_difficulty": incoming_difficulty,
                      "scan_score": scan_score,
                      "control_score": control_score,
                      "intent": intent,
                      "intent_scores": intent_scores,
                      "stance": body["stance"],
                      "forward_view": forward,
                      "open_body": open_body,
                      "pressure": pressure,
                      "space": space,
                  }

              def first_touch_probabilities(
                  self,
                  actor: PlayerState,
                  zone: Zone,
                  ctx: Optional[dict] = None,
                  *,
                  source: str = "open_play",
                  contact_modifier: float = 1.0,
              ) -> dict[str, float]:
                  profile = self.reception_diagnostic(actor, zone, ctx, source=source)
                  score = clamp(
                      float(profile["control_score"])
                      + 0.22 * (float(contact_modifier) - 0.82)
                  )
                  pressure = float(profile["pressure"])
                  difficulty = float(profile["incoming_difficulty"])
                  weights = {
                      "perfect": 0.025 + 0.40 * (score ** 2.15),
                      "clean": 0.48 + 0.48 * score,
                      "heavy": 0.10 + 0.38 * (1.0 - score) + 0.10 * difficulty,
                      "loose": (
                          0.010 + 0.10 * ((1.0 - score) ** 2)
                          + 0.035 * pressure + 0.025 * difficulty
                      ),
                  }
                  total = sum(weights.values())
                  return {key: value / total for key, value in weights.items()}

              def one_touch_probability(
                  self,
                  actor: PlayerState,
                  action: str,
                  zone: Zone,
                  ctx: Optional[dict] = None,
                  *,
                  source: str = "open_play",
              ) -> float:
                  if source == "open_play" or action not in self.ONE_TOUCH_ACTIONS:
                      return 0.0
                  profile = self.reception_diagnostic(actor, zone, ctx, source=source)
                  relevant_attr = {
                      "shoot": "finishing",
                      "cross": "crossing",
                      "cutback": "passing",
                      "through_ball": "passing",
                      "progressive_pass": "passing",
                      "safe_pass": "passing",
                      "switch": "passing",
                      "long_ball": "passing",
                  }.get(action, "technique")
                  relevant = clamp(actor.effective(relevant_attr) / 100.0)
                  technique = clamp(actor.effective("technique") / 100.0)
                  vision = clamp(actor.effective("vision") / 100.0)
                  anticipation = clamp(actor.effective("anticipation") / 100.0)
                  composure = clamp(actor.effective("composure") / 100.0)
                  skill = (
                      0.28 * technique + 0.22 * relevant + 0.17 * vision
                      + 0.17 * anticipation + 0.16 * composure
                  )
                  source_bonus = {
                      "cutback": 0.085,
                      "through_ball": 0.065,
                      "cross": 0.070,
                      "rebound": 0.080,
                      "progressive_pass": 0.030,
                      "progression": 0.025,
                      "safe_pass": 0.020,
                      "switch": 0.010,
                      "long_ball": -0.025,
                  }.get(source, 0.015)
                  action_delta = {
                      "safe_pass": 0.055,
                      "progressive_pass": 0.020,
                      "through_ball": -0.005,
                      "shoot": 0.025,
                      "cross": -0.010,
                      "cutback": 0.015,
                      "switch": -0.035,
                      "long_ball": -0.075,
                  }.get(action, 0.0)
                  probability = (
                      0.015 + 0.36 * skill
                      + 0.055 * float(profile["pressure"])
                      + source_bonus + action_delta
                      - 0.19 * float(profile["incoming_difficulty"])
                      + 0.045 * float(profile["open_body"])
                  )
                  return clamp(probability, 0.02, 0.56)

              @staticmethod
              def _reception_action_modifier(profile: dict, action: str) -> float:
                  quality = float(profile["control_score"])
                  intent = profile["intent"]
                  modifier = 0.93 + 0.12 * quality
                  if intent == "protect":
                      if action == "safe_pass":
                          modifier += 0.10
                      elif action in {"shoot", "through_ball", "dribble"}:
                          modifier -= 0.07
                  elif intent == "forward":
                      if action in {"progressive_pass", "through_ball", "carry", "shoot"}:
                          modifier += 0.06
                  elif intent == "half_turn":
                      if action in {"progressive_pass", "through_ball", "carry", "dribble"}:
                          modifier += 0.045
                  elif intent == "wide_line":
                      if action in {"cross", "cutback", "carry"}:
                          modifier += 0.055
                  elif intent == "wide_inside":
                      if action in {"shoot", "through_ball", "dribble", "carry"}:
                          modifier += 0.055
                      if action == "cross":
                          modifier -= 0.025
                  elif intent == "settle" and action in {"shoot", "through_ball", "dribble"}:
                      modifier -= 0.05
                  return clamp(modifier, 0.80, 1.16)

              def _decision_weights(self, actor, zone, tactics, ctx):
                  items = super()._decision_weights(actor, zone, tactics, ctx)
                  self._ensure_reception_state()
                  profile = self._v13_reception_context
                  if not isinstance(profile, dict):
                      return items
                  adjusted = []
                  for action, weight in items:
                      if action == "dummy":
                          adjusted.append((action, weight))
                      else:
                          adjusted.append((
                              action,
                              max(0.0, weight * self._reception_action_modifier(profile, action)),
                          ))
                  return adjusted

              def _choose_decision(self, actor, zone, tactics, ctx):
                  self._ensure_reception_state()
                  source = self._peek_reception_source(actor, zone)
                  profile = None
                  if source != "open_play":
                      profile = self.reception_diagnostic(actor, zone, ctx, source=source)
                  self._v13_reception_context = profile
                  try:
                      decision = super()._choose_decision(actor, zone, tactics, ctx)
                  finally:
                      self._v13_reception_context = None

                  self._v13_reception_resolution = None
                  if profile is None or decision == "dummy":
                      return decision

                  one_touch_p = self.one_touch_probability(
                      actor, decision, zone, ctx, source=source
                  )
                  if one_touch_p > 0.0 and self.rng.random() < one_touch_p:
                      self._v13_reception_resolution = {
                          "team": self.state.possession,
                          "actor": actor.player.name,
                          "action": decision,
                          "source": source,
                          "mode": "one_touch",
                          "one_touch_probability": round(one_touch_p, 6),
                          "intent": profile["intent"],
                          "control_score": round(float(profile["control_score"]), 6),
                          "incoming_difficulty": round(float(profile["incoming_difficulty"]), 6),
                      }
                      return decision

                  control_part = self._select_action_body_part(
                      actor, "carry", zone, ctx, source=source
                  )
                  contact_modifier = self._part_execution_modifier(
                      actor, "carry", control_part
                  )
                  probabilities = self.first_touch_probabilities(
                      actor,
                      zone,
                      ctx,
                      source=source,
                      contact_modifier=contact_modifier,
                  )
                  quality = weighted_choice(self.rng, list(probabilities.items()))
                  self._v13_reception_resolution = {
                      "team": self.state.possession,
                      "actor": actor.player.name,
                      "action": decision,
                      "source": source,
                      "mode": "controlled",
                      "quality": quality,
                      "reception_body_part": control_part,
                      "contact_modifier": round(float(contact_modifier), 6),
                      "intent": profile["intent"],
                      "control_score": round(float(profile["control_score"]), 6),
                      "incoming_difficulty": round(float(profile["incoming_difficulty"]), 6),
                  }
                  return decision

              def _one_touch_execution_modifier(
                  self,
                  actor: PlayerState,
                  action: str,
                  zone: Zone,
                  ctx: dict,
                  source: str,
              ) -> float:
                  profile = self.reception_diagnostic(actor, zone, ctx, source=source)
                  relevant_attr = "finishing" if action == "shoot" else (
                      "crossing" if action == "cross" else "passing"
                  )
                  relevant = clamp(actor.effective(relevant_attr) / 100.0)
                  technique = clamp(actor.effective("technique") / 100.0)
                  composure = clamp(actor.effective("composure") / 100.0)
                  anticipation = clamp(actor.effective("anticipation") / 100.0)
                  quality = clamp(
                      0.34 * technique + 0.27 * relevant + 0.17 * composure
                      + 0.12 * anticipation + 0.10 * float(profile["open_body"])
                      - 0.16 * float(profile["incoming_difficulty"])
                      - 0.07 * float(profile["pressure"])
                  )
                  return clamp(0.82 + 0.29 * quality, 0.80, 1.08)

              @staticmethod
              def _apply_controlled_reception(ctx: dict, resolution: dict) -> dict:
                  adjusted = dict(ctx)
                  quality = resolution.get("quality", "clean")
                  q_pressure, q_space = {
                      "perfect": (-0.055, 0.065),
                      "clean": (-0.012, 0.018),
                      "heavy": (0.070, -0.070),
                      "loose": (0.145, -0.135),
                  }.get(quality, (0.0, 0.0))
                  intent = resolution.get("intent", "settle")
                  i_pressure, i_space, i_depth = {
                      "forward": (0.015, 0.040, 0.035),
                      "protect": (-0.050, -0.012, -0.018),
                      "half_turn": (-0.020, 0.032, 0.020),
                      "wide_line": (-0.010, 0.025, 0.010),
                      "wide_inside": (0.000, 0.028, 0.022),
                      "settle": (-0.005, 0.000, -0.005),
                  }.get(intent, (0.0, 0.0, 0.0))
                  adjusted["pressure"] = clamp(float(adjusted.get("pressure", 0.5)) + q_pressure + i_pressure)
                  adjusted["space"] = clamp(float(adjusted.get("space", 0.5)) + q_space + i_space)
                  adjusted["space_behind"] = clamp(float(adjusted.get("space_behind", 0.4)) + i_depth)
                  return adjusted

              @staticmethod
              def _attach_reception_metadata(event, resolution: dict) -> None:
                  event.data["reception_mode"] = resolution.get("mode")
                  event.data["reception_source"] = resolution.get("source")
                  event.data["reception_intent"] = resolution.get("intent")
                  event.data["reception_control_score"] = resolution.get("control_score")
                  event.data["reception_difficulty"] = resolution.get("incoming_difficulty")
                  if resolution.get("mode") == "one_touch":
                      event.data["one_touch"] = True
                      event.data["one_touch_probability"] = resolution.get("one_touch_probability")
                  else:
                      event.data["one_touch"] = False
                      event.data["first_touch_quality"] = resolution.get("quality")
                      event.data["reception_body_part"] = resolution.get("reception_body_part")

              def _execute_decision(self, team, actor, zone, decision, ctx):
                  self._ensure_reception_state()
                  resolution = self._v13_reception_resolution
                  matches = (
                      isinstance(resolution, dict)
                      and resolution.get("team") == team
                      and resolution.get("actor") == actor.player.name
                      and resolution.get("action") == decision
                  )
                  if not matches:
                      return super()._execute_decision(team, actor, zone, decision, ctx)

                  adjusted = dict(ctx)
                  if resolution["mode"] == "one_touch":
                      modifier = self._one_touch_execution_modifier(
                          actor, decision, zone, adjusted, resolution["source"]
                      )
                      delta = modifier - 1.0
                      adjusted["pressure"] = clamp(float(adjusted.get("pressure", 0.5)) - 0.22 * delta)
                      adjusted["space"] = clamp(float(adjusted.get("space", 0.5)) + 0.16 * delta)
                      resolution["one_touch_execution"] = round(modifier, 6)
                  else:
                      adjusted = self._apply_controlled_reception(adjusted, resolution)
                      if resolution.get("quality") == "loose":
                          loss_chance = clamp(
                              0.07
                              + 0.24 * float(ctx.get("pressure", 0.5))
                              + 0.16 * (1.0 - float(resolution.get("control_score", 0.5)))
                              + 0.08 * float(resolution.get("incoming_difficulty", 0.5)),
                              0.08,
                              0.46,
                          )
                          resolution["loose_touch_loss_chance"] = round(loss_chance, 6)
                          if self.rng.random() < loss_chance:
                              self._v13_reception_resolution = None
                              self._v13_execution_source = "open_play"
                              event = self._turnover(
                                  team,
                                  actor,
                                  zone,
                                  "bad_first_touch",
                                  adjusted,
                                  severity=0.24 + 0.24 * float(resolution.get("incoming_difficulty", 0.5)),
                              )
                              self._attach_reception_metadata(event, resolution)
                              event.data["intended_action"] = decision
                              event.data["first_touch_lost_possession"] = True
                              return event

                  try:
                      event = super()._execute_decision(team, actor, zone, decision, adjusted)
                  finally:
                      self._v13_reception_resolution = None

                  self._attach_reception_metadata(event, resolution)
                  if resolution.get("mode") == "one_touch":
                      event.data["one_touch_execution"] = resolution.get("one_touch_execution")

                  pending = self.state.pending
                  if (
                      pending is not None
                      and pending.team == team
                      and pending.actor == actor.player.name
                      and decision == "shoot"
                  ):
                      self._v13_pending_reception = dict(resolution)
                  return event

              def _resolve_pending(self):
                  self._ensure_reception_state()
                  pending = self.state.pending
                  marker = self._v13_pending_reception
                  event = super()._resolve_pending()
                  if (
                      pending is not None
                      and isinstance(marker, dict)
                      and marker.get("team") == pending.team
                      and marker.get("actor") == pending.actor
                  ):
                      self._attach_reception_metadata(event, marker)
                      if marker.get("mode") == "one_touch":
                          event.data["one_touch_execution"] = marker.get("one_touch_execution")
                      self._v13_pending_reception = None
                  return event


          MatchEngine = MatchEngineV13Reception

          __all__ = ["MatchEngineV13Reception", "MatchEngine", "VERSION"]
          PYCODE

          cat > test_v13_reception_actions.py <<'PYCODE'
          from __future__ import annotations

          import unittest

          from engine import Band, Lane, Zone, make_generic_team
          from engine_experiment_v13_reception import MatchEngineV13Reception
          from engine_experiment_v13_defense import MatchEngineV13Defense


          class ReceptionActionTests(unittest.TestCase):
              def engine(self):
                  return MatchEngineV13Reception(
                      make_generic_team('Home', 80, 'balanced', seed=101),
                      make_generic_team('Away', 80, 'balanced', seed=202),
                      seed=303,
                  )

              def actor(self, e):
                  return next(ps for ps in e.teams[0].on_field if ps.player.position not in {'GK', 'CB'})

              def ctx(self, pressure=0.35, space=0.62):
                  return {
                      'pressure': pressure,
                      'space': space,
                      'support': 0.58,
                      'space_behind': 0.50,
                  }

              def test_reception_uses_existing_attributes_not_new_player_fields(self):
                  e = self.engine(); a = self.actor(e); z = Zone(Band.ATT, Lane.CENTER)
                  profile = e.reception_diagnostic(a, z, self.ctx(), source='progressive_pass')
                  self.assertIn('control_score', profile)
                  self.assertFalse(hasattr(a.player, 'first_touch'))
                  self.assertFalse(hasattr(a.player, 'one_touch'))

              def test_technique_improves_control_score(self):
                  e = self.engine(); a = self.actor(e); z = Zone(Band.ATT, Lane.CENTER)
                  a.player.technique = 45
                  low = e.reception_diagnostic(a, z, self.ctx(), source='progressive_pass')['control_score']
                  a.player.technique = 95
                  high = e.reception_diagnostic(a, z, self.ctx(), source='progressive_pass')['control_score']
                  self.assertGreater(high, low)

              def test_harder_trajectory_is_harder_to_receive(self):
                  e = self.engine(); a = self.actor(e); z = Zone(Band.ATT, Lane.CENTER)
                  safe = e.reception_diagnostic(a, z, self.ctx(), source='safe_pass')
                  cross = e.reception_diagnostic(a, z, self.ctx(), source='cross')
                  self.assertGreater(cross['incoming_height'], safe['incoming_height'])
                  self.assertGreater(cross['incoming_difficulty'], safe['incoming_difficulty'])

              def test_first_touch_distribution_rewards_better_control(self):
                  e = self.engine(); a = self.actor(e); z = Zone(Band.MID, Lane.CENTER)
                  a.player.technique = 42
                  low = e.first_touch_probabilities(a, z, self.ctx(0.55, 0.42), source='long_ball')
                  a.player.technique = 96
                  high = e.first_touch_probabilities(a, z, self.ctx(0.55, 0.42), source='long_ball')
                  self.assertGreater(high['perfect'], low['perfect'])
                  self.assertLess(high['loose'], low['loose'])
                  self.assertAlmostEqual(sum(high.values()), 1.0, places=8)

              def test_one_touch_is_contextual_and_skill_sensitive(self):
                  e = self.engine(); a = self.actor(e); z = Zone(Band.ATT, Lane.CENTER)
                  a.player.technique = 45; a.player.passing = 48; a.player.vision = 50
                  low = e.one_touch_probability(a, 'progressive_pass', z, self.ctx(), source='progressive_pass')
                  a.player.technique = 95; a.player.passing = 94; a.player.vision = 93
                  high = e.one_touch_probability(a, 'progressive_pass', z, self.ctx(), source='progressive_pass')
                  self.assertGreater(high, low)
                  self.assertEqual(e.one_touch_probability(a, 'carry', z, self.ctx(), source='progressive_pass'), 0.0)
                  self.assertEqual(e.one_touch_probability(a, 'shoot', z, self.ctx(), source='open_play'), 0.0)

              def test_oriented_reception_changes_with_pressure(self):
                  e = self.engine(); a = self.actor(e); z = Zone(Band.ATT, Lane.CENTER)
                  open_profile = e.reception_diagnostic(a, z, self.ctx(0.10, 0.88), source='through_ball')
                  closed_profile = e.reception_diagnostic(a, z, self.ctx(0.92, 0.18), source='safe_pass')
                  self.assertIn(open_profile['intent'], {'forward', 'half_turn'})
                  self.assertIn(closed_profile['intent'], {'protect', 'settle'})

              def test_both_footed_wide_body_profile_is_neutral(self):
                  e = self.engine(); a = self.actor(e)
