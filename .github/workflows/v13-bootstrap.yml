name: Bootstrap v1.3 candidate sources

on:
  push:
    branches: [v1.3-spatial-creativity-boldness]

permissions:
  contents: write

jobs:
  unpack-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Detect staged source bundle
        id: staged
        shell: bash
        run: |
          if compgen -G '.bootstrap/part-*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore v1.3 source tree
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          cat .bootstrap/part-* > /tmp/v13.b64
          base64 -d /tmp/v13.b64 > /tmp/v13.tar.xz
          tar -xJf /tmp/v13.tar.xz
          rm -rf .bootstrap

      - name: Commit restored candidate sources
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate v1.3 candidate through defensive cover'
          git push origin HEAD:v1.3-spatial-creativity-boldness
