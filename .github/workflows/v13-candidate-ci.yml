name: Match Engine v1.3 Candidate CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  candidate-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate candidate databases
        run: |
          python -m json.tool data/teams.json > /dev/null
          python -m json.tool data/v13_player_traits.json > /dev/null

      - name: Compile stable and candidate source
        run: >-
          python -m compileall -q
          engine.py engine_experiment_v12.py stable_engine.py team_loader.py team_loader_v13.py
          engine_experiment_v13.py engine_experiment_v13_spatial.py
          engine_experiment_v13_offball.py engine_experiment_v13_body.py
          engine_experiment_v13_defense.py engine_experiment_v13_marking.py
          engine_experiment_v13_cover.py engine_experiment_v13_communication.py
          engine_experiment_v13_offside.py engine_experiment_v13_overload.py
          engine_experiment_v13_errors.py engine_experiment_v13_chemistry.py
          engine_experiment_v13_adaptation.py engine_experiment_v13_adaptation_stability.py
          engine_experiment_v13_persistence.py engine_experiment_v13_knockout.py
          engine_experiment_v13_determination.py
          final_protocol_v13.py diagnostics_v13.py calibration_v13.py evaluation_v13.py runner_v13.py
          test_engine.py test_engine_v12.py test_team_loader.py
          test_spatial_decisions.py test_offball_anticipation.py
          test_body_orientation.py test_defensive_intelligence.py
          test_marking_handoffs.py test_defensive_cover.py
          test_defensive_communication.py test_offside_line.py test_overload_reactions.py
          test_defensive_errors.py test_shared_understanding.py test_tactical_adaptation.py
          test_adaptation_stability.py test_v13_player_traits.py test_determination_v13.py
          test_extended_validation_v13.py test_calibration_v13.py test_v13_persistence.py
          test_runner_v13.py test_final_protocol_v13.py test_knockout_v13.py

      - name: Run stable v1.2 regression suite
        run: python -m unittest -v test_engine.py test_engine_v12.py test_team_loader.py

      - name: Run v1.3 candidate suite
        run: >-
          python -m unittest -v
          test_spatial_decisions.py
          test_offball_anticipation.py
          test_body_orientation.py
          test_defensive_intelligence.py
          test_marking_handoffs.py
          test_defensive_cover.py
          test_defensive_communication.py
          test_offside_line.py
          test_overload_reactions.py
          test_defensive_errors.py
          test_shared_understanding.py
          test_tactical_adaptation.py
          test_adaptation_stability.py
          test_v13_player_traits.py
          test_determination_v13.py
          test_extended_validation_v13.py
          test_calibration_v13.py
          test_v13_persistence.py
          test_runner_v13.py
          test_final_protocol_v13.py
          test_knockout_v13.py

      - name: Run 100-match v1.3 generic smoke simulation
        run: python diagnostics_v13.py 100

      - name: Run 100-seed Amiguinhos x Flamengo calibration
        run: python calibration_v13.py 100 --start-seed 0 --compact

      - name: Run 24-seed Amiguinhos x Flamengo adaptation stress
        run: python calibration_v13.py 24 --start-seed 0 --auto-adapt --compact

      - name: Probe uncapped adaptation demand on same 24 seeds
        run: >-
          python calibration_v13.py 24 --start-seed 0 --auto-adapt
          --uncapped-adaptation-diagnostic --compact

  extended-evaluation:
    needs: candidate-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run 300-match all-opponent home-away evaluation
        run: python evaluation_v13.py --count 10 --base-seed 1000 --compact

      - name: Run additional 300-seed Amiguinhos x Flamengo stress
        run: python calibration_v13.py 300 --start-seed 20000 --compact

      - name: Compare 120 identical seeds with and without auto adaptation
        run: python evaluation_v13.py --adaptation-ab --count 120 --base-seed 30000 --compact

      - name: Run 120 final-like knockout matches with adaptation and extra time
        run: python evaluation_v13.py --knockout --count 120 --base-seed 40000 --compact
