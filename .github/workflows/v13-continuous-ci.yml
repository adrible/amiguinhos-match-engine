name: Continuous v1.3 Physics and Possession

on:
  pull_request:
    branches: [main, feature/player-xy-ball-xyz-v13, feature/continuous-football-v13]
  workflow_dispatch:

jobs:
  continuous:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Physics, geometry, possession and controlled context tests
        run: python -m unittest -v test_continuous_physics_v13 test_continuous_engine_v13 test_continuous_contexts_v13 test_continuous_advantage_v13 test_continuous_calibration_v13
      - name: Complete independent continuous matches
        run: python validation/continuous_v13/run_smoke.py 126000 2 /tmp/continuous-smoke.json
      - name: Restore and replay a complete continuous match
        run: python validation/continuous_v13/verify_resume.py --seed 138500 --minute 45 --output /tmp/continuous-resume.json
      - uses: actions/upload-artifact@v4
        with:
          name: continuous-smoke-py${{ matrix.python-version }}
          path: |
            /tmp/continuous-smoke.json
            /tmp/continuous-resume.json
