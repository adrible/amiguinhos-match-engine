name: Match Engine v1.3 Match Flow Realism CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: v13-match-flow-realism-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  match-flow-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile layer and tests
        run: python -m py_compile engine_experiment_v13_match_flow_realism.py test_v13_match_flow_realism.py engine_experiment_v13.py

      - name: Run match-flow realism tests
        run: python -m unittest -v test_v13_match_flow_realism.py

      - name: Run short canonical smoke
        run: python diagnostics_v13.py 20
