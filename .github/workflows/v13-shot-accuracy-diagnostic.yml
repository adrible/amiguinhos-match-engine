name: Match Engine v1.3 Shot Accuracy Diagnostic

on:
  pull_request:
    branches: [main]

concurrency:
  group: v13-shot-accuracy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shot-accuracy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile diagnostic
        run: python -m py_compile shot_accuracy_diagnostics_v13.py

      - name: Run shot accuracy diagnostic
        run: |
          mkdir -p artifacts
          python shot_accuracy_diagnostics_v13.py 300 --start-seed 91000 \
            | tee artifacts/shot_accuracy_v13.json

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: v13-shot-accuracy-diagnostic
          path: artifacts/shot_accuracy_v13.json
          if-no-files-found: error
